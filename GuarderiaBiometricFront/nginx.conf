server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: react-router maneja rutas como /panel/pagos del lado del cliente.
    # Sin este fallback, recargar en una de esas rutas le pediría a nginx un
    # archivo que no existe y daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker (sw.js, generado por vite-plugin-pwa) no debe quedar
    # cacheado agresivamente: el navegador necesita revisarlo seguido para
    # detectar actualizaciones.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
